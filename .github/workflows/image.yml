name: Image

# Baut das Docker-Image. Auf main (und bei Tags v*) wird es nach
# ghcr.io/<owner>/matchdesk-shift veröffentlicht, in PRs nur gebaut und kurz gestartet.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t shift:ci .

      - name: Rauchtest unter Unterpfad
        run: |
          docker run -d --name shift -p 3000:3000 \
            -e BASE_PATH=/game-servers/shift \
            -e INTEGRATION_API_KEY=ci-key \
            -e INTEGRATION_WEBHOOK_SECRET=ci-secret \
            shift:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/game-servers/shift/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/game-servers/shift/health
          curl -fsS http://127.0.0.1:3000/game-servers/shift/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer falsch' http://127.0.0.1:3000/game-servers/shift/api/integrations/v1/tables/x)" = 401

      - name: Log bei Fehler
        if: failure()
        run: docker logs shift || true

      - name: Bei ghcr anmelden
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Veröffentlichen
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag shift:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag shift:ci "$IMAGE:${GITHUB_REF_NAME#v}"
            docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          else
            docker tag shift:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
